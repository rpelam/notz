<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Notz</title>
<meta name="description" content="Notes, vocaux, photos et rappels, en un geste.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ Sign-in ============ -->
<main class="auth" id="authView" hidden>
  <img src="icons/icon-192.png" alt="" class="auth-logo" width="72" height="72">
  <h1 id="authTitle">Notz</h1>
  <p class="auth-intro" id="authIntro"></p>
  <form id="authForm" class="group" novalidate>
    <label class="field"><span>Courriel</span><input type="email" id="authEmail" autocomplete="username" inputmode="email" autocapitalize="off" required></label>
    <label class="field"><span>Mot de passe</span><input type="password" id="authPass" autocomplete="current-password" required minlength="8"></label>
    <label class="field" id="confirmWrap" hidden><span>Confirmer</span><input type="password" id="authPass2" autocomplete="new-password" minlength="8"></label>
  </form>
  <p class="auth-msg" id="authMsg" role="status"></p>
  <button type="submit" form="authForm" class="big-btn" id="authBtn">Se connecter</button>
</main>

<!-- ============ List ============ -->
<main class="home" id="homeView" hidden>
  <header class="home-head">
    <div class="topbar">
      <span class="sync" id="status"></span>
      <button type="button" class="round-btn" id="settingsBtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <h1 class="large-title">Notz</h1>
    <label class="searchbar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input type="search" id="search" placeholder="Rechercher" autocomplete="off">
    </label>
    <div class="segmented" role="tablist">
      <button type="button" role="tab" id="tabRem" aria-selected="true">Rappels</button>
      <button type="button" role="tab" id="tabAll" aria-selected="false">Toutes les notes</button>
    </div>
  </header>

  <div class="due" id="dueBanner" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
    <span id="dueText"></span>
  </div>

  <div id="list"></div>

  <div class="empty" id="empty" hidden>
    <p id="emptyText"></p>
  </div>
</main>

<!-- Bottom toolbar (like Notes) -->
<nav class="toolbar" id="toolbar" hidden>
  <button type="button" class="tb-btn" id="quickPhoto" aria-label="Nouvelle note photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.6l1.6-2.2h6.6L16.9 7h2.6A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.8" r="3.6"/></svg>
  </button>
  <button type="button" class="tb-btn" id="quickVoice" aria-label="Nouvelle note vocale">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
  </button>
  <span class="tb-count" id="countLabel"></span>
  <button type="button" class="tb-btn tb-compose" id="composeBtn" aria-label="Nouvelle note">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13v6.5A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-13A1.5 1.5 0 0 1 5.5 5H12"/><path d="M17.5 3.2a2 2 0 0 1 2.8 2.8L12 14.3l-3.6.8.8-3.6z"/></svg>
  </button>
</nav>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<!-- ============ Editor (full screen sheet) ============ -->
<section class="sheet" id="editor" hidden aria-modal="true" role="dialog" aria-labelledby="edTitle">
  <header class="navbar">
    <button type="button" class="nav-btn" id="edCancel">Annuler</button>
    <span class="nav-title" id="edTitle">Nouvelle note</span>
    <button type="button" class="nav-btn strong" id="edSave">OK</button>
  </header>
  <div class="ed-body" id="edBody">
    <textarea id="edText" placeholder="Écris ta note…" autocapitalize="sentences"></textarea>
    <div class="ed-remind" id="edRemind" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
      <label class="ed-remind-when"><span id="edRemindLabel"></span><input type="datetime-local" id="edRemindAt" aria-label="Modifier la date du rappel"></label>
      <span class="ed-remind-src" id="edRemindSrc"></span>
      <button type="button" class="x-btn" id="edRemindClear" aria-label="Retirer le rappel">×</button>
    </div>
    <div class="rec" id="recBar" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span class="rec-time" id="recTime">0:00</span>
      <button type="button" class="rec-cancel" id="recCancel">Annuler</button>
      <button type="button" class="rec-stop" id="recStop">Terminer</button>
    </div>
    <div class="ed-media" id="edMedia"></div>
    <div class="ed-tags" id="edTags"></div>
    <div class="ed-danger" id="edDanger" hidden>
      <button type="button" class="ed-link" id="edDone"></button>
      <button type="button" class="ed-link red" id="edDelete">Supprimer la note</button>
    </div>
    <p class="ed-msg" id="edMsg" role="status"></p>
  </div>
  <footer class="accessory">
    <button type="button" class="acc-btn" id="accRemind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Rappel</span></button>
    <button type="button" class="acc-btn" id="accPhoto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.6l1.6-2.2h6.6L16.9 7h2.6A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.8" r="3.6"/></svg><span>Photo</span></button>
    <button type="button" class="acc-btn" id="accVoice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg><span>Vocal</span></button>
  </footer>
</section>

<!-- ============ Settings sheet ============ -->
<section class="sheet" id="settings" hidden aria-modal="true" role="dialog" aria-labelledby="setTitle">
  <header class="navbar">
    <span></span>
    <span class="nav-title" id="setTitle">Réglages</span>
    <button type="button" class="nav-btn strong" id="setClose">OK</button>
  </header>
  <div class="set-body">
    <p class="group-label">Notifications de rappel</p>
    <div class="group">
      <div class="cell"><span>Sur cet appareil</span><span class="cell-value" id="pushState">…</span></div>
      <button type="button" class="cell cell-btn" id="pushBtn">Activer les notifications</button>
      <button type="button" class="cell cell-btn" id="pushTest" hidden>Envoyer une notification de test</button>
    </div>
    <p class="group-foot" id="installHint" hidden>Sur iPhone, les notifications ne marchent que pour l'app installée. Dans Safari, touche Partager, puis « Sur l'écran d'accueil », et ouvre Notz depuis son icône.</p>
    <p class="group-label">Compte</p>
    <div class="group">
      <div class="cell"><span>Connecté</span><span class="cell-value" id="whoami"></span></div>
      <button type="button" class="cell cell-btn red" id="logoutBtn">Se déconnecter</button>
    </div>
  </div>
</section>

<script src="vendor/supabase.js"></script>
<script src="date-fr.js"></script>
<script src="app.js"></script>
</body>
</html>
